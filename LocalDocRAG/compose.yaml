name: localdocrag
services:
  web:
    build:
      context: ${LOCALDOC_FRONTEND_DIR:-./frontend}
    ports:
      - "127.0.0.1:${APP_PORT:-7860}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [local]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 6
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    volumes: [app-data:/data]
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks: [local]
    logging: *logging
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes: [qdrant-data:/qdrant/storage]
    restart: unless-stopped
    networks: [local]
    logging: *logging
  ollama:
    image: ollama/ollama:0.13.5
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
    volumes: [ollama-data:/root/.ollama]
    restart: unless-stopped
    networks: [local, downloads]
    logging: *logging
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 8s
      retries: 12
networks:
  # API has no public egress: document parsing/models cannot contact third parties.
  local: {internal: true}
  # Ollama needs egress only to download model weights; documents stay internal.
  downloads: {}
volumes:
  app-data:
  qdrant-data:
  ollama-data:
