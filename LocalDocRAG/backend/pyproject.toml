[project]
name = "local-doc-rag"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.5",
  "httpx==0.28.1", "python-multipart==0.0.20", "sqlalchemy==2.0.41",
  "alembic==1.16.1", "python-docx==1.1.2", "lxml==5.4.0",
  "pillow==11.2.1", "jieba==0.42.1", "rapidocr==3.2.0",
  "onnxruntime==1.22.0", "numpy==2.2.6", "pyyaml==6.0.2",
]

[project.optional-dependencies]
docling = ["docling==2.36.1"]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

